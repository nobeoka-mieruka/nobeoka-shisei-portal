name: Update council documents

# 延岡市議会公式サイト「議案等審議結果」ページを毎日確認し、新しい定例会・臨時会PDFを
# 検出してこのリポジトリへ反映する。差分がある場合のみコミット・pushする。
# cronはUTC基準のため、日本時間 午前6時ごろ（UTC 21:00）に設定している。
on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-council-documents
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # sitemap.xml/構造化データのlastmod（scripts/lib/lastmod.mjs）は、各ファイルの
          # 実際のGit最終コミット日を`git log -1 -- <path>`で調べて求めている。デフォルトの
          # 浅いclone（fetch-depth:1）だと、直近コミットで変更されていないファイルは履歴を
          # 辿れずlastmodがundefinedとなり、フォールバックの「サイト全体の最終更新日
          # （＝ビルド実行日）」に落ちてしまい、実際には更新していないページのlastmodが
          # 毎回「今日」に見えてしまう不具合があったため、全履歴を取得する。
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Fetch official council documents
        run: npm run fetch:council-documents

      - name: Extract bill/vote data from result PDFs
        run: npm run extract:council-data

      - name: Generate bill summaries
        run: npm run generate:bill-summaries

      - name: Suggest bill revision-history comparison candidates
        run: npm run suggest:bill-relations

      - name: Reconcile with local PDF folder
        run: npm run generate:council-documents

      - name: Generate session summaries
        run: npm run generate:session-summaries

      - name: Update speech-summary scaffold (bookkeeping only; no minutes fetching yet)
        run: npm run generate:speech-summary-scaffold

      - name: Generate search index
        run: npm run generate:search

      - name: Check pending council minutes (WAITING_EXTERNAL auto-recheck, Phase114)
        run: node --experimental-strip-types scripts/check-pending-council-minutes.mjs
        continue-on-error: true

      - name: Validate data
        run: npm run validate:data

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build (includes prerender + SEO checks)
        run: npm run build

      - name: Release check
        run: node scripts/release-check.mjs

      - name: Check for changes
        id: diff
        run: |
          if git status --porcelain | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/councilSessions.json src/data/councilDocumentSources.json src/data/councilExtractionSources.json src/data/billVotes.json src/data/updateHistory.json src/data/searchIndex.json src/data/siteUpdate.json src/data/blockedTaskClassification.json public/council-documents public/sitemap.xml public/robots.txt reports/council-document-update-report.json reports/council-extraction-review.json reports/council-extraction-review.md
          if git diff --cached --name-only | grep -q "^src/data/blockedTaskClassification.json$" && git diff --cached -- src/data/blockedTaskClassification.json | grep -q '^-.*"status": "WAITING_EXTERNAL"'; then
            echo "notice=公開待ち資料の状態が遷移しました（blockedTaskClassification.jsonを確認してください）" >> "$GITHUB_STEP_SUMMARY"
          fi
          git commit -m "chore: 延岡市議会の最新資料を自動更新"
          git push origin HEAD:main

      - name: Upload update reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: council-document-update-report
          path: |
            reports/council-document-update-report.json
            reports/council-extraction-review.json
            reports/council-extraction-review.md
          if-no-files-found: ignore
          retention-days: 90
