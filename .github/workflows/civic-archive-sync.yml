name: Civic archive crawler (foundation, 5-day check)

# フェーズ10A：自動巡回基盤。
#
# 一般質問・議案・条例・請願・陳情・議員名簿は既に .github/workflows/sync-council-data.yml
# （scripts/sync-council-data.mjs・scripts/fetch-nobeoka-council-documents.mjs）が実データ取得を
# 行っているため、このワークフローでは重複取得しない（src/data/archiveCrawlerTargets.jsonの
# existingImplementationが設定された対象は常にスキップする）。
#
# 今回のフェーズでは実際のHTTP取得・差分の自動反映は行わない
# （scripts/run-archive-crawler.mjsのダミー実装）。そのため、このワークフローは
# コミット・Pull Requestの作成を行わない（src/data/archiveCrawlerState.jsonの更新結果は
# ワークフロー実行ログ・GitHub Actions Summaryでのみ確認できる）。実データ取得を実装する際は
# .github/workflows/sync-council-data.yml と同様のbotブランチ経由Pull Request方式を追加すること。
#
# 5日間隔の実現方法は sync-council-data.yml と同じ考え方：毎日起動した上で、
# 前回正常実行から120時間（5日）以上経過している場合のみ本処理を実行する。
# 前回正常実行日時は scripts/run-archive-crawler.mjs が管理するローカル状態ファイル
# （scripts/_archive-crawler-sync-state.json、Git管理外）で判定し、
# このファイル自体はactions/cacheで実行間を跨いで保持する。
#
# cronはUTC基準のため、日本時間 午前4時ごろ（UTC 19:00、前日）に設定している
# （sync-council-data.ymlと同時刻を避けるため30分ずらしている）。
on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "120時間ゲートを無視して即時実行する"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: civic-archive-sync
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore crawler gate state
        uses: actions/cache/restore@v4
        with:
          path: scripts/_archive-crawler-sync-state.json
          key: civic-archive-crawler-state-${{ github.run_id }}
          restore-keys: |
            civic-archive-crawler-state-

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run archive crawler (foundation, dummy fetch)
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          node scripts/run-archive-crawler.mjs $FORCE_FLAG

      - name: Save crawler gate state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: scripts/_archive-crawler-sync-state.json
          key: civic-archive-crawler-state-${{ github.run_id }}

      - name: Upload crawler state artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-crawler-state
          path: src/data/archiveCrawlerState.json
          if-no-files-found: ignore
          retention-days: 30
